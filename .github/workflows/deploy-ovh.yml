# Déploie le site sur l'hébergement OVH (www.nexsim.fr) par SFTP.
#
# Déclenchement manuel uniquement. Le distant est mis à l'identique de src/ :
# tout ce qui n'existe plus localement est supprimé, tout le reste est réécrit.
#
# Le déploiement commence toujours par régénérer src/image/opt/, qui n'est pas
# versionné : sans cette étape le site partirait avec des <picture> pointant vers
# des fichiers absents.
#
# Le cluster129 refuse le FTPS sur le port 21 (« server does not support or
# allow SSL ») : le transfert passe donc par SFTP sur le port 22, qui chiffre la
# session de bout en bout et n'a pas de canal de données séparé à protéger.
#
# Secrets attendus :
#   OVH_FTP_HOST      ftp.cluster129.hosting.ovh.net
#   OVH_FTP_USER      ex. nexsimx
#   OVH_FTP_PASSWORD
name: Déployer sur OVH (SFTP)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation : afficher les transferts et les suppressions sans rien écrire'
        type: boolean
        default: true

concurrency:
  # Deux déploiements simultanés se marcheraient dessus, l'un supprimant ce que
  # l'autre vient d'écrire. On attend plutôt que le précédent finisse.
  group: deploy-ovh
  cancel-in-progress: false

env:
  REMOTE_DIR: /home/nexsimx/www
  # Clé d'hôte publique du cluster, relevée le 2026-09-17 par ssh-keyscan. La
  # coder ici authentifie le serveur à chaque exécution, au lieu de faire
  # confiance à ce qui répond au bout du câble. Si OVH migre le compte vers un
  # autre cluster, la connexion échouera sur une erreur de clé d'hôte : relever
  # la nouvelle avec `ssh-keyscan -t ed25519 <hôte>` et la remplacer ici.
  OVH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHzGPnvg+XUpaMELjQ4AIj/6pkjvvHYCUxDVpcdaC8T

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Un environnement GitHub permet d'exiger une approbation avant chaque
    # déploiement (Settings > Environments > production > Required reviewers).
    environment: production
    steps:
      # En premier : inutile de passer trois minutes à construire les images pour
      # buter sur un secret manquant au moment de se connecter.
      - name: Vérifier que les secrets sont accessibles
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          set -uo pipefail
          manquants=0
          # Actions n'exporte pas une variable dont la valeur est vide : un secret
          # absent arrive ici comme une variable non définie, d'où le "${VAR-}".
          # Sans ce garde, l'absence se manifeste bien plus loin sous la forme
          # « SSHPASS environment variable not set », qui ne désigne pas la cause.
          for nom in FTP_HOST FTP_USER FTP_PASSWORD; do
            eval "valeur=\${$nom-}"
            if [ -z "$valeur" ]; then
              echo "::error::Le secret OVH_$nom est absent ou vide"
              manquants=1
            else
              echo "OVH_$nom : défini"
            fi
          done
          if [ "$manquants" -ne 0 ]; then
            echo "Settings > Secrets and variables > Actions : vérifier l'orthographe exacte." >&2
            echo "Secrets d'organisation : vérifier que ce dépôt figure dans « Repository access »." >&2
            echo "Ce job utilise l'environnement « production » : un secret rangé dans un autre environnement ne lui est pas visible." >&2
            exit 1
          fi

      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'latest'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Générer les déclinaisons d'images
        run: |
          set -euo pipefail
          cd tools
          npm ci
          node build-images.mjs

      # Un déploiement sans manifeste laisserait le site en ligne réclamer des
      # fichiers qui n'ont jamais été produits : mieux vaut échouer ici.
      - name: Vérifier que le manifeste a été produit
        run: |
          set -euo pipefail
          test -s src/image/opt/manifest.json
          test -s src/.htaccess
          echo "$(find src -type f | wc -l) fichiers à déployer ($(du -sh src | cut -f1))"

      - name: Installer lftp et sshpass
        # sshpass fournit le mot de passe à ssh : sans lui, ssh le réclamerait
        # sur un terminal qui n'existe pas dans un runner.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp sshpass

      - name: Déclarer la clé d'hôte du serveur
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s %s\n' "$FTP_HOST" "$OVH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Envoyer src/ sur OVH
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          dry=''
          [ "$DRY_RUN" != 'true' ] || dry='--dry-run'

          lftp <<LFTP
          set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password"
          set sftp:auto-confirm no

          set net:max-retries 3
          set net:timeout 30
          set xfer:clobber on
          set cmd:fail-exit true

          open -u "$FTP_USER" --env-password "sftp://$FTP_HOST"

          cd "$REMOTE_DIR"
          cls -d .

          mirror --reverse --delete --verbose --parallel=4 $dry --exclude '^\.well-known/' --exclude-glob '.DS_Store' src/ "$REMOTE_DIR"

          bye
          LFTP

      - name: Récapitulatif
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo '### Déploiement OVH'
            echo "- Cible : \`$REMOTE_DIR\` sur www.nexsim.fr"
            echo "- Commit : \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME})"
            if [ "$DRY_RUN" = 'true' ]; then
              echo '- **Simulation** : rien n'"'"'a été écrit. Relancer avec `dry_run` décoché pour déployer.'
            else
              echo '- Déploiement réel effectué.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

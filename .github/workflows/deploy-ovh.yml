# Déploie le site sur l'hébergement OVH (www.nexsim.fr) par FTP.
#
# Déclenchement manuel uniquement. Le distant est mis à l'identique de src/ :
# tout ce qui n'existe plus localement est supprimé, tout le reste est réécrit.
#
# Le déploiement commence toujours par régénérer src/image/opt/, qui n'est pas
# versionné : sans cette étape le site partirait avec des <picture> pointant vers
# des fichiers absents.
#
# Secrets attendus :
#   OVH_FTP_HOST      ex. ftp.cluster0XX.hosting.ovh.net
#   OVH_FTP_USER      ex. nexsimx
#   OVH_FTP_PASSWORD
name: Déployer sur OVH (FTP)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation : afficher les transferts et les suppressions sans rien écrire'
        type: boolean
        default: true

concurrency:
  # Deux déploiements simultanés se marcheraient dessus, l'un supprimant ce que
  # l'autre vient d'écrire. On attend plutôt que le précédent finisse.
  group: deploy-ovh
  cancel-in-progress: false

env:
  REMOTE_DIR: /home/nexsimx/www

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Un environnement GitHub permet d'exiger une approbation avant chaque
    # déploiement (Settings > Environments > production > Required reviewers).
    environment: production
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'latest'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Générer les déclinaisons d'images
        run: |
          set -euo pipefail
          cd tools
          npm ci
          node build-images.mjs

      # Un déploiement sans manifeste laisserait le site en ligne réclamer des
      # fichiers qui n'ont jamais été produits : mieux vaut échouer ici.
      - name: Vérifier que le manifeste a été produit
        run: |
          set -euo pipefail
          test -s src/image/opt/manifest.json
          test -s src/.htaccess
          echo "$(find src -type f | wc -l) fichiers à déployer ($(du -sh src | cut -f1))"

      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp

      - name: Envoyer src/ sur OVH
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          # Lu directement par lftp (--env-password) : le mot de passe ne
          # transite ni par la ligne de commande ni par un fichier de script.
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          dry=''
          [ "$DRY_RUN" != 'true' ] || dry='--dry-run'

          lftp <<LFTP
          # FTP explicite (FTPES) : OVH accepte le FTP en clair, qui ferait
          # voyager le mot de passe et les fichiers sans chiffrement.
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          # Si la connexion échoue sur une erreur de certificat, passer à "no" :
          # le canal reste chiffré, mais le serveur n'est plus authentifié.
          set ssl:verify-certificate yes

          # Sans -a, le listing distant masque les fichiers commençant par un
          # point : .htaccess serait renvoyé à chaque déploiement et jamais
          # comparé — et, surtout, jamais supprimé s'il disparaissait du dépôt.
          set ftp:list-options -a

          set net:max-retries 3
          set net:timeout 30
          set xfer:clobber on
          # Une erreur au milieu du miroir doit faire échouer le workflow, pas
          # laisser un site à moitié déployé passer pour un succès.
          set cmd:fail-exit true

          open -u "$FTP_USER" --env-password "$FTP_HOST"

          # --delete aligne le distant sur src/ au lieu de le vider d'abord : le
          # site n'est jamais servi depuis un répertoire à moitié rempli, et un
          # transfert interrompu laisse la version précédente en place.
          #
          # --exclude protège ce qu'OVH ou une validation de domaine dépose
          # elle-même dans le docroot ; ajouter ici tout fichier maintenu à la
          # main en ligne, sinon --delete l'emportera.
          #
          # Le checkout donne à tous les fichiers la date du jour : lftp les voit
          # plus récents que le distant et renvoie donc l'intégralité de src/
          # (~62 Mio, dont 47 de vidéos) à chaque exécution. C'est voulu. Si la
          # durée devient gênante, ajouter --ignore-time : la comparaison se fait
          # alors sur la seule taille, au prix des modifications qui n'en
          # changent pas — une correction de faute de frappe, typiquement.
          mirror --reverse --delete --verbose --parallel=4 $dry --exclude '^\.well-known/' --exclude-glob '.DS_Store' src/ "$REMOTE_DIR"

          bye
          LFTP

      - name: Récapitulatif
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo '### Déploiement OVH'
            echo "- Cible : \`$REMOTE_DIR\` sur www.nexsim.fr"
            echo "- Commit : \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME})"
            if [ "$DRY_RUN" = 'true' ]; then
              echo '- **Simulation** : rien n'"'"'a été écrit. Relancer avec `dry_run` décoché pour déployer.'
            else
              echo '- Déploiement réel effectué.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

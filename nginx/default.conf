# Environnement de développement uniquement : la production tourne sous Apache
# et lit src/.htaccess. Toute règle destinée au site en ligne va là-bas — les
# règles ci-dessous ne font que reproduire son comportement en local.

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Le conteneur écoute sur 80 mais le compose le publie sur 8090 : nginx
    # ignore ce port et forgerait des « Location: http://127.0.0.1/… » qui
    # sortent du site. Un chemin relatif évite la question.
    absolute_redirect off;

    sendfile off;

    # La feuille de style est intégrée au document : le HTML doit être compressé,
    # sans quoi chaque page transporte ~36 Ko de CSS en clair.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Les woff2 sont déjà compressés : les repasser en gzip ne ferait que coûter
    # du CPU.

    # Anciennes URL du site découpé en pages : miroir des RewriteRule de
    # src/.htaccess, qui fait foi. Le fragment « # » est écrit tel quel — nginx
    # ne le réécrit pas, contrairement à Apache qui demande le drapeau NE.
    location = /lusim.php                     { return 301 /#physique; }
    location = /contact.php                   { return 301 /#contact; }
    location = /equipe.php                    { return 301 /#equipe; }
    location = /politique-confidentialite.php { return 301 /politique-de-confidentialite.php; }
    location = /politique-cookies.php         { return 301 /politique-de-confidentialite.php; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Miroir de « ErrorDocument 404 /404.php ». Sans « = » devant @notfound,
    # nginx conserve le statut 404 quel que soit celui du sous-appel : la page
    # d'erreur ne peut pas être servie par mégarde avec un 200.
    error_page 404 @notfound;

    location @notfound {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/404.php;
        fastcgi_param SCRIPT_NAME /404.php;
    }

    location ~ \.php$ {
        # Sans cela, le « 404 File not found. » que php-fpm renvoie pour un
        # script absent part tel quel au visiteur, sans passer par error_page.
        # Volontairement absent du bloc @notfound plus bas : 404.php répond
        # lui-même 404, et l'y intercepter ferait boucler nginx sur lui-même.
        fastcgi_intercept_errors on;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Polices auto-hébergées : le nom de fichier désigne une version figée
    # d'Open Sans, le contenu ne changera pas sous la même URL.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Déclinaisons d'images : le nom porte une empreinte du contenu (voir
    # tools/build-images.mjs), comme côté Apache.
    location ^~ /image/opt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # image/avif fait partie de la table mime de nginx depuis la 1.21.4 ; ne pas
    # ajouter de bloc types ici, il remplacerait la table héritée au lieu de la
    # compléter.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|ico|mp4|mov|glb)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    sendfile off;

    # La feuille de style est intégrée au document : le HTML doit être compressé,
    # sans quoi chaque page transporte ~36 Ko de CSS en clair.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Les woff2 sont déjà compressés : les repasser en gzip ne ferait que coûter
    # du CPU.

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Polices auto-hébergées : le nom de fichier désigne une version figée
    # d'Open Sans, le contenu ne changera pas sous la même URL.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico|mp4|mov|glb)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}

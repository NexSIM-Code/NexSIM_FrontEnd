# Développement local : le code de src/ est monté en volume, une modification est
# visible au rechargement de la page sans reconstruire quoi que ce soit.
#
#   docker compose -f docker-compose.dev.yml up -d        → http://localhost:8090
#
# Ce fichier sert nginx + php-fpm et lit nginx/default.conf, qui ne fait que
# reproduire le comportement de src/.htaccess. Pour vérifier le .htaccess lui-même,
# c'est la pré-prod Apache qu'il faut lancer (docker-compose.yml).
#
# Les déclinaisons d'images ne sont pas produites ici : `cd tools && npm run build`
# après toute image ajoutée ou remplacée (voir tools/README.md).

services:
  nginx:
    image: nginx:latest
    container_name: nginx-nexsim
    ports:
      - "8090:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    image: php:8.2-fpm
    container_name: php-nexsim
    volumes:
      - ./src:/var/www/html
    restart: always
